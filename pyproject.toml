[project]
name = "prometheus-aws-cost-exporter"
version = "0.2.0"
description = "Prometheus exporter for cloud cost, commitment-discount and spot savings metrics"
authors = [
    { name = "Ignacio Millán" },
    { name = "Bharath Kumar", email = "bharath.dtu@gmail.com" },
    { name = "Anton Markelov", email = "doublic@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "boto3 (>=1.43.82,<2.0.0)",
    "botocore (>=1.43.82,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "google-cloud-bigquery (>=3.44.0,<4.0.0)",
    "google-auth (>=2.57.0,<3.0.0)",
]

[tool.poetry]
packages = [
    { include = "app" },
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]
